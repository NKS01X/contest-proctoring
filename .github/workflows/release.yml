name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            out: contest-proctor-windows-amd64.exe
          - os: ubuntu-22.04
            platform: linux/amd64
            out: contest-proctor-linux-amd64
          - os: macos-latest
            platform: darwin/universal
            out: contest-proctor-macos-universal.zip
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.9.2

      - name: Build
        shell: bash
        working-directory: daemon
        run: |
          go mod tidy
          wails build -clean -platform ${{ matrix.platform }} -ldflags "-s -w"

      - name: Package
        shell: bash
        working-directory: daemon/build/bin
        run: |
          case "${{ runner.os }}" in
            Windows) mv contest-proctor.exe "${{ matrix.out }}" ;;
            Linux) mv contest-proctor "${{ matrix.out }}" ;;
            macOS) zip -qr "${{ matrix.out }}" contest-proctor.app ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: daemon/build/bin/${{ matrix.out }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
