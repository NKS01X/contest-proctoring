services:
  - type: web
    name: contest-proctoring-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CONTEST_PASSWORD
        sync: false
      - key: HOST_KEY
        sync: false
      # auto-prune events not seen again for N hours (0 = off)
      - key: RETENTION_HOURS
        value: "0"
      - key: PRUNE_KEEP_FLAGGED
        value: "1"
